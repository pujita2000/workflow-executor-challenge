[package]
name = "profound-workflow-executor-challenge"
version = "0.1.0"
edition = "2021"

[lib]
name = "workflow_executor"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
